apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: queueevents.sre.example.com
spec:
  group: sre.example.com
  scope: Namespaced
  names:
    plural: queueevents
    singular: queueevent
    kind: QueueEvent
    shortNames:
      - qe
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                nodeName:
                  type: string
                reason:
                  type: string
                severity:
                  type: string
                message:
                  type: string
                status:
                  type: string
            status:
              type: object
              properties:
                processedAt:
                  type: string
                  format: date-time
                message:
                  type: string
      subresources:
        status: {}