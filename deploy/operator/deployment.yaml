apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-health-operator
  namespace: sre-system
  labels:
    app: k8s-health-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-health-operator
  template:
    metadata:
      labels:
        app: k8s-health-operator
    spec:
      serviceAccountName: k8s-health-operator
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: k8s-health-operator:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8081
            - --health-probe-bind-address=:8082
          ports:
            - name: metrics
              containerPort: 8081
            - name: health
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
