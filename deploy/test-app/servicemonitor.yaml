apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: test-app
  namespace: test-app
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: test-app
  namespaceSelector:
    matchNames:
      - test-app
  endpoints:
    - port: http
      path: /metrics
      interval: 15s